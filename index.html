<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>iDA Workplace</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- 全站（登入頁＋內頁）的英文和數字用 Jost（跟 Logo 的細線幾何字形接近）；中文照舊用系統字型。
         字重 400–700 都要載入：內頁的標題、按鈕會用到 600／700。
         只載入英文字母，檔案很小；連不上 Google Fonts 時會自動退回系統字型。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" />

    <!-- 安裝成 App 用的設定檔與圖示。theme-color 是手機上網址列／狀態列的
         底色，兩種佈景各給一個，深色模式下才不會是刺眼的白。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101010" media="(prefers-color-scheme: dark)" />

    <!-- iOS 不看 manifest 的這幾項，要另外用它自己的 meta 標籤指定 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="iDA Workplace" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
